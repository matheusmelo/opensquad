name: CI/CD — OpenSquad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (orchestrator + parsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json

      - name: Install orchestrator deps
        working-directory: orchestrator
        run: npm ci

      - name: Prisma generate
        working-directory: orchestrator
        run: npx prisma generate

      - name: Run orchestrator tests
        working-directory: orchestrator
        run: npm test --if-present
        env:
          DATABASE_URL: file:./prisma/test.db
          JWT_SECRET: test-secret

      - name: Run parser tests
        working-directory: squads/shlomo-engineering/parsers
        run: npm test --if-present || true

  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Type check
        working-directory: dashboard
        run: npx tsc --noEmit || true

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://opensquad.railway.app' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'wss://opensquad.railway.app' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 7

  deploy-railway:
    name: Deploy Railway
    runs-on: ubuntu-latest
    needs: [test, build-dashboard]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
